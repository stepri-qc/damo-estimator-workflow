<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Estimation Workflow Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#F4F5F8; --surface:#FFFFFF; --surface-2:#F8F9FB; --ink:#18202B; --muted:#5A6472; --faint:#8A93A0;
  --line:#DCE0E7; --accent:#9B2F66; --accent-ink:#FFFFFF; --accent-soft:#F7E8F0;
  --add:#2B7657; --add-soft:#E3F2EB; --risk:#A9620E; --risk-soft:#FBEEDC; --round:#4F5FA8; --round-soft:#E8EBF8;
  --warn:#B3261E; --warn-soft:#FBE5E3;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#10141A; --surface:#181E27; --surface-2:#1D242E; --ink:#E7EBF0; --muted:#A0A9B6; --faint:#6F7987;
    --line:#2B333F; --accent:#E27AAF; --accent-ink:#1A0E14; --accent-soft:#3A1F2D;
    --add:#63C095; --add-soft:#173327; --risk:#E6A85C; --risk-soft:#3A2A15; --round:#98A6EA; --round-soft:#232A45;
    --warn:#F08A80; --warn-soft:#3C1D1B;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#10141A; --surface:#181E27; --surface-2:#1D242E; --ink:#E7EBF0; --muted:#A0A9B6; --faint:#6F7987;
  --line:#2B333F; --accent:#E27AAF; --accent-ink:#1A0E14; --accent-soft:#3A1F2D;
  --add:#63C095; --add-soft:#173327; --risk:#E6A85C; --risk-soft:#3A2A15; --round:#98A6EA; --round-soft:#232A45;
  --warn:#F08A80; --warn-soft:#3C1D1B;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 var(--body)}
a{color:var(--accent)}
h1,h2,h3{font-family:var(--display);line-height:1.2;margin:0}
code,.mono{font-family:var(--mono);font-size:.92em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:0;z-index:10;background:var(--surface);border-bottom:1px solid var(--line)}
.top .in{max-width:1200px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:12px 16px;flex-wrap:wrap}
.brand{margin-right:auto;display:grid;gap:2px}
.brand .eb{font:600 11px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.brand b{font:800 19px/1.1 var(--display)}
.prog{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.prog .bar{width:140px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:6px;cursor:pointer;font:500 14px var(--body);text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;color:var(--muted)}
.btn.sm{padding:5px 10px;font-size:13px}

.layout{max-width:1200px;margin:0 auto;padding:24px 20px 60px;display:grid;grid-template-columns:260px minmax(0,1fr);gap:28px}
nav.toc{position:sticky;top:78px;align-self:start;max-height:calc(100vh - 100px);overflow:auto}
nav.toc ol{list-style:none;margin:0;padding:0;display:grid;gap:2px}
nav.toc button{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:24px 1fr;gap:8px;align-items:center;padding:8px 10px;border-radius:6px;cursor:pointer;font-size:14px;color:var(--muted)}
nav.toc button:hover{background:var(--surface)}
nav.toc button[aria-current="page"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:inset 3px 0 0 var(--accent)}
nav.toc .n{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font:600 11px var(--mono);color:var(--muted)}
nav.toc .done .n{background:var(--add);border-color:var(--add);color:#fff}
nav.toc .grp{font:600 11px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);padding:14px 10px 4px}
.tocsel{display:none;width:100%;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);font:inherit}

main{min-width:0}
.chap{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:28px 32px}
.chap .eyebrow{font:600 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.chap h1{font-size:30px;margin:6px 0 10px}
.chap h2{font-size:20px;margin:28px 0 8px}
.chap h3{font-size:16px;margin:18px 0 6px}
.chap p{margin:8px 0}
.lead{font-size:18px;color:var(--muted);max-width:70ch}
.chap ul,.chap ol{padding-left:22px}
.chap li{margin:4px 0}
.steps{counter-reset:s;list-style:none;padding:0!important;display:grid;gap:10px}
.steps>li{counter-increment:s;display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;margin:0}
.steps>li::before{content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:600 13px var(--mono);margin-top:1px}
.ui{font-weight:600;background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:.93em;white-space:nowrap}
.tip,.warn,.note{border-radius:8px;padding:12px 14px;margin:14px 0;font-size:15px}
.tip{background:var(--add-soft);border-left:3px solid var(--add)}
.warn{background:var(--risk-soft);border-left:3px solid var(--risk)}
.note{background:var(--surface-2);border-left:3px solid var(--line)}
.tip b:first-child,.warn b:first-child,.note b:first-child{display:block;margin-bottom:2px}
table{border-collapse:collapse;width:100%;font-size:14px;margin:10px 0}
th{font:600 11px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.r{text-align:right;white-space:nowrap}
.tbl{overflow-x:auto}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{border:1px solid var(--line);border-radius:8px;padding:14px 16px;background:var(--surface-2)}
.card h3{margin-top:0}
.chapnav{display:flex;justify-content:space-between;gap:12px;margin-top:28px;padding-top:18px;border-top:1px solid var(--line);flex-wrap:wrap}
.try{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:16px 0;padding:12px 14px;border:1px dashed var(--accent);border-radius:8px;background:var(--accent-soft)}
.try span{font-size:14px}

/* calculators */
.calc{border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin:18px 0;background:var(--surface-2)}
.calc h3{margin:0 0 4px;font-size:16px}
.calc .sub{font-size:13px;color:var(--muted);margin-bottom:12px}
.calc .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.calc label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.calc input,.calc select{padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);font:inherit;font-size:14px;min-width:0}
.calc input[type=range]{padding:0}
.out{margin-top:14px;display:grid;gap:6px;font:14px/1.5 var(--mono)}
.out .row{display:grid;grid-template-columns:1fr auto;gap:10px;padding:6px 10px;border-radius:6px;background:var(--surface)}
.out .row.tot{background:var(--accent-soft);font-weight:600}
.out .row span:first-child{font-family:var(--body)}
.out .f{font-size:12px;color:var(--muted);grid-column:1/-1}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px}
.seg button{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 10px;border-radius:6px;cursor:pointer;font:500 13px var(--body)}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* diagram */
.teams{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:stretch;margin:16px 0}
.teams .box{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--surface-2)}
.teams .box b{display:block;font-family:var(--display);font-size:16px;margin-bottom:4px}
.teams .vs{display:grid;place-items:center;font:700 14px var(--mono);color:var(--accent)}
.teams .res{grid-column:1/-1;text-align:center;border:1px solid var(--accent);background:var(--accent-soft);border-radius:10px;padding:10px;font-weight:600}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:14px 0}
.flow span{padding:6px 10px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);font-size:13px}
.flow i{font-style:normal;color:var(--faint)}

/* quiz */
.quiz{border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin:22px 0 0}
.quiz h3{margin:0 0 10px;font-size:16px}
.q{margin:14px 0}
.q p{margin:0 0 8px;font-weight:600}
.q .opts{display:grid;gap:6px}
.q button{all:unset;box-sizing:border-box;padding:9px 12px;border:1px solid var(--line);border-radius:6px;cursor:pointer;font-size:14px;background:var(--surface)}
.q button:hover{border-color:var(--accent)}
.q button.right{border-color:var(--add);background:var(--add-soft)}
.q button.wrong{border-color:var(--warn);background:var(--warn-soft)}
.q .why{font-size:14px;color:var(--muted);margin-top:6px}
.score{font-weight:600;margin-top:8px}

/* checklist + glossary */
.check{list-style:none;padding:0!important;display:grid;gap:6px}
.check label{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);cursor:pointer}
.check input{margin-top:4px}
.search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);font:inherit;margin:8px 0 12px}
dl.gl{margin:0;display:grid;gap:10px}
dl.gl div{border-bottom:1px solid var(--line);padding-bottom:10px}
dl.gl dt{font-weight:600}
dl.gl dd{margin:2px 0 0;color:var(--muted);font-size:15px}
details.faq{border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin:8px 0;background:var(--surface-2)}
details.faq summary{cursor:pointer;font-weight:600}
details.faq p{margin:8px 0 2px;color:var(--muted);font-size:15px}

@media (max-width:900px){
  .layout{grid-template-columns:1fr;padding:16px 16px 48px}
  nav.toc{display:none}
  .tocsel{display:block;margin-bottom:12px}
  .chap{padding:20px 16px}
  .cols2,.teams{grid-template-columns:1fr}
  .teams .vs{padding:4px}
  .prog .bar{width:80px}
}
@media print{.top,nav.toc,.tocsel,.chapnav,.try{display:none}.layout{display:block}.chap{border:0}}
</style>
</head>
<body>
<header class="top">
  <div class="in">
    <div class="brand"><span class="eb">DAMO · Deal review</span><b>Estimation Workflow · User guide</b></div>
    <div class="prog" aria-live="polite"><span id="progTxt">0 of 0 read</span><span class="bar"><i id="progBar"></i></span></div>
    <a class="btn primary" href="index.html" target="_blank" rel="noopener">Open the tool ↗</a>
  </div>
</header>

<div class="layout">
  <nav class="toc" aria-label="Guide chapters"><ol id="toc"></ol></nav>
  <main>
    <select class="tocsel" id="tocSel" aria-label="Go to chapter"></select>
    <article class="chap" id="chap" tabindex="-1"></article>
  </main>
</div>

<script>
(function(){
"use strict";
const KEY="damo-workflow-guide-v1";
let P={};try{P=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){P={}}
P.done=P.done||{};P.check=P.check||{};P.quiz=P.quiz||{};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(P))}catch(e){}};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=(x,d=2)=>(Math.round(x*10**d)/10**d).toFixed(d);
const tryTool=(n,text)=>`<div class="try"><a class="btn sm primary" href="index.html#stage=${n}" target="_blank" rel="noopener">Open ${n===0?"Documents":"step "+({1:1,2:2,3:5,4:6,5:3,6:7,7:8,8:9,9:4,10:10})[n]} in the tool ↗</a><span>${text}</span></div>`;

/* ================= chapters ================= */
const CH=[
{id:"welcome",grp:"Start here",t:"What the tool does",html:()=>`
<span class="eyebrow">Start here · 5 min</span>
<h1>What the Estimation Workflow does</h1>
<p class="lead">It sizes a DAMO managed-service team in FTE, one step at a time, so a deal review can see exactly how the number was built: every input, formula, assumption and risk. The nine steps run in two parts: <b>Part 1</b> works out the Year 1 number and triangulates it; <b>Part 2</b> tests whether that team is enough and finishes the estimate.</p>
<h2>The one idea to understand first</h2>
<p>Part 1 builds the team twice, from two different questions, and keeps the larger. They are compared, not added. A third view, the team running the estate today, checks the answer.</p>
<div class="teams">
  <div class="box"><b>Base team · Step 1</b>How many people keep someone on duty in every hour?<br><span style="color:var(--muted);font-size:14px">Support window, each location's working and on-call hours, people on duty. Ignores ticket volume.</span></div>
  <div class="vs">vs</div>
  <div class="box"><b>Work team · Step 2</b>How many people does the work take?<br><span style="color:var(--muted);font-size:14px">Tickets, service levels, SLAs, enhancements, skill sets, leave and risk.</span></div>
  <div class="res">Step 3: delivery team = the larger of the two (AI engineers always kept on top) + SDM = the Part 1 team → Step 4 checks it against the existing team → Part 2 tests skill cover, adds transformation, grade mix and contingency</div>
</div>
<p>If the work team is bigger, the people doing the work also staff the windows. If the base team is bigger, the windows need more people than the work, so the team is lifted to the base team and the spare time is shown. Part 2 uses that spare time first.</p>
<h2>The steps</h2>
<div class="tbl"><table>
<thead><tr><th>#</th><th>Step</th><th>What you decide</th></tr></thead>
<tbody>
<tr><td>0</td><td>Documents</td><td>Upload RFP, incident dump, notes; Claude proposes inputs (optional)</td></tr>
<tr><td colspan="3"><b>Part 1 · The Year 1 number</b></td></tr>
<tr><td>1</td><td>Base team</td><td>Support window, customer time zone, each location's working and on-call windows, people on duty</td></tr>
<tr><td>2</td><td>Service towers</td><td>Towers, who provides L1/L2/L3, SLAs, demand, SRE, AIOps, skill sets</td></tr>
<tr><td>3</td><td>Reconcile &amp; SDM</td><td>Base vs work team; Service Delivery Managers at 1:8. Result: the Part 1 team</td></tr>
<tr><td>4</td><td>Triangulation</td><td>Ticket volume, base team and existing team side by side</td></tr>
<tr><td colspan="3"><b>Part 2 · Validate and finalise</b></td></tr>
<tr><td>5</td><td>Skill coverage</td><td>Which windows each specialist must be live in: is the Part 1 team enough, or is headcount added?</td></tr>
<tr><td>6</td><td>Transformation</td><td>Client AI adoption → framework scenario and POD share</td></tr>
<tr><td>7</td><td>Seniority &amp; contingency</td><td>Complexity, grade pyramid (mix only), contingency, confidence score</td></tr>
<tr><td>8</td><td>Term &amp; savings</td><td>Contract term, Year 2+ savings, optional transition</td></tr>
<tr><td>9</td><td>Final fact check &amp; approval</td><td>The final team against the existing team, assumptions register, roles, allowances, approval, exports</td></tr>
</tbody></table></div>
<h2>What stays true everywhere</h2>
<ul>
<li><b>FTE only.</b> No rates, cost or price. The pricing sheet takes the FTE by grade and location.</li>
<li><b>After every step:</b> assumptions and risks. Assumptions are grouped by category (coverage, demand, scope, SLA, effort, skills, transformation, governance, seniority, term, client responsibilities) and gathered in one register at step 9. Risks carry an FTE modifier %; suggested ones start switched off.</li>
<li><b>The bar at the bottom</b> shows the team after the step you're on: the Part 1 team at steps 3 and 4, then what each Part 2 step adds, and the Year 1 team from step 7.</li>
<li><b>Sources are tagged</b> <code>[F]</code> framework, <code>[P]</code> pricing sheet, or <code>proposed</code> where the framework is silent.</li>
<li><b>Your work is saved in your browser</b> automatically. The <span class="ui">File</span> menu has Open file, Save file and Reset; the <span class="ui">Export</span> menu has the deal-review summary, the customer summary, the Excel workbook and Copy summary.</li>
<li><b>The two tabs at the top</b> are the two parts, each showing its team: Part 1 the Part 1 team, Part 2 the Year 1 team. Under them are the steps of the part you are in. A green dot means a step is ready, an amber dot means it still needs a choice (hover for what), a hollow dot means optional. The bar stays on screen as you scroll, with Previous and Next arrows at its right.</li>
</ul>
<div class="quiz" data-quiz="welcome"></div>`,
quiz:[
 {q:"The base team is 8 FTE and the work team (without AI engineers) is 12 FTE. What is the delivery team before SDM?",o:["20 FTE: they are added","12 FTE: the larger one","8 FTE: the base team is the floor"],a:1,why:"The two are compared, not added. The work team's people staff the shifts as part of doing the work."},
 {q:"Where do rates and price come in?",o:["Step 8","Step 9","Not in this tool: it sizes FTE only"],a:2,why:"The tool produces FTE by role, grade and location. Pricing happens in the pricing sheet."}
]},

{id:"prep",grp:"Start here",t:"Before you start",html:()=>`
<span class="eyebrow">Start here · 5 min</span>
<h1>What to gather before you start</h1>
<p class="lead">You can start with nothing and fill in as you learn, but these inputs move the number most. Tick what you have; your list is remembered in this browser.</p>
<ul class="check" id="prepList"></ul>
<div class="tip"><b>No ticket history?</b> That's normal early on. Step 2 falls back to estate size (T-shirt sizing) and then to monthly active users. The confidence score in Step 7 will say how much that weakens the estimate.</div>
<h2>How long it takes</h2>
<p>About 20–30 minutes for a first pass with two or three towers, less if you start from documents on step 0. A deal review walk-through of a finished estimate takes 10 minutes using the stage results and the summary document.</p>`},

{id:"docs",grp:"Start here",t:"Step 0 · Documents",html:()=>`
<span class="eyebrow">Step 0 · optional</span>
<h1>Start from documents with Extract with AI</h1>
<p class="lead">Upload what you have and Claude proposes inputs for every stage, each with the quote it came from. Nothing changes until you choose what to apply.</p>
<ol class="steps">
<li><div>Add files to the four cards: <span class="ui">RFP</span>, <span class="ui">Incident dump</span>, <span class="ui">Meeting notes</span>, <span class="ui">Others</span>. PDF, Word, text, Excel and CSV work; you can also paste text.</div></li>
<li><div>An incident dump (ITSM export) is <b>summarised in your browser</b>: tickets a month, priority mix, top groups. Only the summary is sent to Claude, not the raw export.</div></li>
<li><div>Enter the <b>passphrase</b> (ask the tool owner) and click <span class="ui">Extract with AI</span>. It takes 30–90 seconds for a typical RFP.</div></li>
<li><div>Review <span class="ui">Proposed inputs</span>, grouped by stage. Untick anything you don't agree with, then <span class="ui">Apply selected and go to Step 1</span>.</div></li>
</ol>
<h2>What Claude can propose</h2>
<p>Deal name; coverage window and P1s a month; towers with who provides L1/L2/L3, SLAs, priority mix, ticket volumes (and where they're counted) or estate size, enhancements, SRE and AIOps scope, skill sets; AI adoption; complexity; term; existing team; assumptions, risks and open questions for the client.</p>
<div class="note"><b>Where the inputs came from</b> Every applied input keeps its source and quote. It shows under the coverage window, on each tower card, and in Step 9's <span class="ui">Where the inputs came from</span> table. If someone edits it later it's flagged <i>edited since</i>.</div>
<div class="warn"><b>Always check the proposals</b> Claude only proposes what the documents support, but it can misread a table. Applied risks arrive switched off at 0%, and open questions become Step 1 assumptions to confirm with the client.</div>
${tryTool(0,"Drop in an RFP and see what it proposes.")}
<div class="quiz" data-quiz="docs"></div>`,
quiz:[
 {q:"What happens to the raw incident export?",o:["It's uploaded to Claude as-is","It's summarised in your browser; only the summary is sent","It's stored on the server"],a:1,why:"The browser computes monthly volumes, priority mix and top groups, and sends only that summary."},
 {q:"You apply a proposed risk from the documents. What FTE effect does it have?",o:["Its suggested % immediately","None until you switch it on and set a %","It doubles the contingency"],a:1,why:"Imported risks arrive switched off at 0%, so the deal team decides the modifier."}
]},

{id:"s1",grp:"Part 1 · The Year 1 number",t:"Step 1 · Base team",html:()=>`
<span class="eyebrow">Part 1 · Step 1</span>
<h1>Base team from coverage windows and locations</h1>
<p class="lead">How many people it takes to keep someone on duty in every hour of the support window, whatever the ticket volume, given when each delivery location actually works.</p>
<ol class="steps">
<li><div>Pick the <b>support window</b> (<span class="ui">24x5</span>, <span class="ui">16x7</span> …), the time it <b>starts</b> and the <b>customer's time zone</b> as a UTC offset. The window is on the customer's clock.</div></li>
<li><div>Set <b>people on duty</b> (L2 and L3). The framework minimum is one each.</div></li>
<li><div>Add the <b>delivery locations</b> with their UTC offset, leave and public holidays.</div></li>
<li><div>Give each location its <b>working windows in its own local time</b>. A window is <span class="ui">Active</span> (people working) or <span class="ui">On-call (P1)</span> (reachable for critical incidents only). <span class="ui">Lay out evenly</span> splits the support window across your locations as a starting point.</div></li>
<li><div>Watch the <b>live coverage strip</b> pinned above the inputs: it redraws as you change a window, so a gap or overlap appears while you type. Then read the full <b>coverage timeline</b> below: one row per location, local clock times in every cell, green for active, orange for on call. It shows how many window hours are active, how many are on call only, any hours nobody covers, and where two locations overlap.</div></li>
<li><div>Choose the <b>on-call allowance</b>: a flat % (default 15%), or <span class="ui">From P1 volume</span>: 10% standby plus P1s a month × hours per call-out ÷ 728 hours.</div></li>
<li><div>The tool divides by 85% utilisation and adds leave and holiday backfill per location.</div></li>
</ol>
<div class="note"><b>Example</b> Customer in Minneapolis (UTC−5), 24×5. Ecuador works 09:00–19:00 local. India works 09:30–19:30 and is on call 05:30–09:30 local. On the customer's clock India is active 23:00–09:00 and on call 19:00–23:00, so 20 hours are active, 4 are on call only, nothing is uncovered and nothing overlaps.</div>
<div class="calc" id="calcCov">
  <h3>Try it: coverage roster</h3>
  <div class="sub">Same formula as the tool, before utilisation and leave: roster = (staffed hours a week × people on duty) ÷ contracted hours, [F] p.3 worked in hours.</div>
  <div class="grid">
    <label>Hours a day<select id="cvH"><option>8</option><option>16</option><option selected>24</option></select></label>
    <label>Days a week<select id="cvD"><option selected>5</option><option>7</option></select></label>
    <label>People on duty (L2 + L3)<input id="cvC" type="number" min="1" max="10" value="2"></label>
    <label>Hours a day on call only<select id="cvK"></select></label>
    <label>On-call allowance %<input id="cvO" type="number" min="0" max="100" value="15"></label>
  </div>
  <div class="out" id="cvOut"></div>
</div>
<div class="tip"><b>Check yourself against the framework</b> 24×5 with 2 people on duty and no on-call gives (120 h × 2) ÷ 40 = 6.0 FTE: the framework's own p.3 example.</div>
<div class="note"><b>Overlap is paid for</b> Hours where two locations are both active (a handover cushion) are staffed twice and counted in the roster. The timeline shows them so you can decide whether the cushion is worth it. Hours worked outside the support window are counted too.</div>
${tryTool(1,"Set the coverage windows and watch the timeline and the bar at the bottom.")}
<div class="quiz" data-quiz="s1"></div>`,
quiz:[
 {q:"A window switched from Active to On-call (P1) counts as…",o:["A fully staffed window","Nothing","The on-call allowance % of a staffed window"],a:2,why:"On-call windows count at the allowance, 15% by default, or standby plus P1 workload if you size it from P1 volume."},
 {q:"Does ticket volume change the base team?",o:["Yes","No"],a:1,why:"The base team only answers 'is every hour covered?'. Volume drives the work team in step 2."},
 {q:"India and Ecuador are both active from 14:00 to 16:00 on the customer's clock. How is that counted?",o:["Once","Twice: both teams are staffed","Not at all"],a:1,why:"Overlap is a handover cushion. Both locations are staffed, so both are counted; the timeline shows the overlap hours."}
]},
{id:"s2",grp:"Part 1 · The Year 1 number",t:"Step 2 · Service towers",html:()=>`
<span class="eyebrow">Step 2 · the heart of the estimate</span>
<h1>Service towers: demand, service levels and skill sets</h1>
<p class="lead">Add an <b>AMS</b>, <b>IMS</b>, <b>DMS</b> or <b>AI platforms</b> tower for each estate in scope. Each tower turns demand into effort and FTE, then splits it across skill sets.</p>
<h2>For each tower, top to bottom</h2>
<ol class="steps">
<li><div><b>Who provides each support level.</b> Presets: <span class="ui">Client L1 · us L2 + L3</span> (default), <span class="ui">Us L1–L3</span>, <span class="ui">Us L2 only</span>, <span class="ui">Us L3 only</span>, or pick per level. Only our levels are sized. Every change of owner between adjacent levels adds <b>4% coordination</b> to our ticket effort.</div></li>
<li><div><b>Service levels (SLA), optional.</b> P1/P2 response and restore, availability class, or <span class="ui">Gold</span> / <span class="ui">Silver</span> / <span class="ui">Bronze</span>. Stringent targets add effort on L2/L3 ([F] Sc.3 Step 2), capped at 40%. </div></li>
<li><div><b>Demand, in order.</b> Ticket history if the client has it: <b>incidents, service requests and change requests a month</b>. Incidents are split by <b>severity</b> (P1 to P4, counts or %; with counts at L1 the mix sends P1/P2 straight to L2/L3) and counted at L1, L2 or L3. Service requests and change requests are each split by <b>complexity</b> (Low / Medium / High, counts or %): SRs are costed by complexity and done by L1 (Low), L2 (Medium) or L3 (High); CRs are planned engineering work on L3 (or L2). The AREs are in the Benchmarks panel. If not, the estate's structural complexity (T-shirt sizing for apps, environments/DBs for IMS, pipelines for DMS, agents/models for AI). If not even that, monthly active users.</div></li>
<li><div><b>Enhancement pool</b> (optional hours a month, separate from change requests) and <b>estate</b> (modern or complex legacy: 25% or 35% non-ticketing effort).</div></li>
<li><div><b>SRE</b> (IMS only): if the client names reliability as an objective, an SRE takes 78% of that tower's L3 FTE. A role-mix change, not extra headcount.</div></li>
<li><div><b>AIOps</b>: if in scope, AI engineers are added at 1 per 4 support FTE (low AI adoption) or 1 per 8 (moderate; 1:6 above 20 FTE).</div></li>
<li><div><b>Skill sets</b> with a share % each, e.g. <span class="ui">Systems Support Engineer (L2/L3)</span> 70%, <span class="ui">Front end dev</span> 30%. <span class="ui">Base has skill</span> means the base roster covers it on every shift; others get their own cover in Step 5.</div></li>
</ol>
<div class="flow"><span>Tickets a month</span><i>→</i><span>L1 30% resolved · L2 70% · L3 = L2 × 20%</span><i>→</i><span>hours: L1 0.25 · L2 3 · L3 10, + SLA, + coordination</span><i>→</i><span>÷ 85% utilisation</span><i>→</i><span>+ B non-ticketing 25/35%</span><i>→</i><span>÷ 160 h = FTE</span></div>
<div class="calc" id="calcTw">
  <h3>Try it: one tower from tickets to FTE</h3>
  <div class="sub">Same formula as the tool (before leave backfill and risk).</div>
  <div class="grid">
    <label>Tickets a month<input id="twT" type="number" min="0" value="100"></label>
    <label>Counts measured at<select id="twL"><option value="l1">All tickets (L1)</option><option value="l2">Tickets reaching L2</option></select></label>
    <label>Who provides<select id="twO"><option value="cl1">Client L1 · us L2 + L3</option><option value="full">Us L1–L3</option><option value="l2">Us L2 only</option><option value="l3">Us L3 only</option></select></label>
    <label>SLA preset<select id="twS"><option value="none">None entered</option><option value="bronze">Bronze</option><option value="silver">Silver</option><option value="gold">Gold</option></select></label>
    <label>Estate<select id="twE"><option value="modern">Modern (B 25%)</option><option value="legacy">Complex legacy (B 35%)</option></select></label>
  </div>
  <div class="out" id="twOut"></div>
</div>
<div class="tip"><b>The framework's worked example</b> 100 tickets at L1, Us L1–L3, no SLA, modern: 30 / 70 / 14 tickets, 420.6 hours, 3.29 FTE.</div>
${tryTool(2,"Add a tower and answer its questions top to bottom.")}
<div class="quiz" data-quiz="s2"></div>`,
quiz:[
 {q:"The client's ITSM export has every ticket raised. Where are the counts measured?",o:["All tickets (L1)","Tickets reaching L2","Tickets reaching L3"],a:0,why:"A whole-queue export is L1 inflow; 70% passes to L2. An incumbent's L2 queue would be 'reaching L2'."},
 {q:"We provide L2 only, the client runs L1 and another supplier runs L3. What coordination uplift applies?",o:["0%","4%","8%"],a:2,why:"Two interfaces (L1→L2 and L2→L3) with different owners, 4% each."},
 {q:"SRE is set to Yes on an IMS tower. What happens to headcount?",o:["It adds SREs on top","It doesn't change; SRE takes 78% of that tower's L3 FTE","It removes L2"],a:1,why:"SRE changes who does the L3 work, not how much work there is."}
]},

{id:"s5",grp:"Part 1 · The Year 1 number",t:"Step 3 · Reconcile & SDM",html:()=>`
<span class="eyebrow">Part 1 · Step 3</span>
<h1>Reconcile and SDM</h1>
<p class="lead">This is where the two teams meet. The larger one is kept, AI engineers stay on top, and Service Delivery Managers are added at 1 per 8 delivery FTE. The result is the <b>Part 1 team</b>: the number Part 2 tests.</p>
<div class="calc" id="calcRe">
  <h3>Try it: base vs work</h3>
  <div class="grid">
    <label>Base team (Step 1)<input id="reB" type="number" min="0" step="0.1" value="8.65"></label>
    <label>Work team without AI engineers<input id="reW" type="number" min="0" step="0.1" value="5.5"></label>
    <label>AI engineers<input id="reA" type="number" min="0" step="0.1" value="1"></label>
    <label>SDM ratio (1 per)<input id="reS" type="number" min="1" value="8"></label>
  </div>
  <div class="out" id="reOut"></div>
</div>
<div class="note"><b>Why AI engineers stay on top</b> They build automation; they don't staff shifts. So the base team can't stand in for them when it's the larger team.</div>
${tryTool(5,"See the comparison bars and the verdict sentence.")}`},

{id:"s9",grp:"Part 1 · The Year 1 number",t:"Step 4 · Triangulation",html:()=>`
<span class="eyebrow">Part 1 · Step 4</span>
<h1>Triangulate the Part 1 number</h1>
<p class="lead">Three independent views of the same team: what the ticket volume needs, what the support window needs, and what the client runs today. The Part 1 number is still the larger of the first two. The existing team is the cross-check that tells you whether to trust it.</p>
<ol class="steps">
<li><div>Enter the <b>existing team</b> by tier (L2, L3, SRE / automation, managers, other), where the numbers came from, and the <b>tolerance</b> that counts as consistent (default ±10%).</div></li>
<li><div>Read the <b>three bars</b>: ticket volume (step 2, without AI engineers), base team (step 1) and existing team (L2 + L3 + SRE / automation), next to our Part 1 support team.</div></li>
<li><div>Read the <b>verdict</b>: it says which of ticket volume and coverage sets the number, whether the existing team agrees, and how far apart the three views are.</div></li>
</ol>
<div class="note"><b>The existing team never changes the number</b> It is evidence, not an input to the calculation. If it is far above ours, check scope, the window it covers and hidden capacity. If it is far below, check for out-of-scope work in today's team before presenting a saving.</div>
<div class="tip"><b>Two places for the fact check</b> This step checks the Part 1 team against today. Step 9 checks the final Year 1 team, and each year of the term, against the same numbers.</div>
${tryTool(9,"Enter the existing team and read the verdict.")}
<div class="quiz" data-quiz="s9"></div>`,
quiz:[
 {q:"The existing team is 30% below our Part 1 support team. What does the tool do to the number?",o:["Lowers it to match","Nothing: it flags the gap for you to explain","Raises the contingency"],a:1,why:"The existing team is a cross-check. The Part 1 number stays the larger of the ticket-volume and base teams."},
 {q:"Which three views are triangulated?",o:["Ticket volume, base team, existing team","Base team, SDM, contingency","Incidents, requests, changes"],a:0,why:"Ticket volume (work team), the support window (base team) and the team the client runs today."}
]},
{id:"s3",grp:"Part 2 · Validate and finalise",t:"Step 5 · Skill coverage",html:()=>`
<span class="eyebrow">Part 2 · Step 5</span>
<h1>Skill coverage: is the Part 1 team enough?</h1>
<p class="lead">Specialist skill sets (anything not marked <span class="ui">Base has skill</span>) need their own cover. You choose where they must be live; elsewhere they're on call. The step then says whether the Part 1 team can carry that or needs more headcount.</p>
<ol class="steps">
<li><div>For each specialist skill set, tick the windows (a location's active or on-call window) where someone must be <b>live</b> and set people per live window.</div></li>
<li><div>In the other windows it's <b>on call</b>, counted at 15% of a staffed window (editable).</div></li>
<li><div>The tool compares that <b>coverage floor</b> with the FTE the skill already has from step 2 and tops up only the gap.</div></li>
<li><div>The verdict card then compares the top-up with the <b>spare capacity</b> in the Part 1 team (the base team above the work team). Spare capacity is used first; <b>additional headcount</b> is added only for what is still missing.</div></li>
</ol>
<div class="note"><b>Example</b> Database is live in one window only: floor ≈ 1.7 FTE. If step 2 gave it 0.5 FTE of work, the top-up is 1.2. If the Part 1 team has 0.8 FTE spare, 0.4 FTE of headcount is added. If it already had 2.0 FTE of work, nothing is added.</div>
${tryTool(3,"Set live windows for a specialist skill and read the verdict.")}`},

{id:"s4",grp:"Part 2 · Validate and finalise",t:"Step 6 · Transformation",html:()=>`
<span class="eyebrow">Part 2 · Step 6</span>
<h1>Transformation capacity</h1>
<p class="lead">The framework scenario is worked out, not picked: client AI adoption × whether volumetrics are available (towers sized from ticket history carry at least half the tower FTE).</p>
<div class="calc" id="calcSc">
  <h3>Try it: which scenario?</h3>
  <div class="grid">
    <label>Client AI adoption<select id="scA"><option value="low">Low</option><option value="moderate">Moderate</option></select></label>
    <label>Tower FTE from ticket history<select id="scV"><option value="0">Under 50%</option><option value="1">50% or more</option></select></label>
    <label>Support team from the work (FTE)<input id="scR" type="number" min="0" value="20"></label>
    <label>AI engineers already added in Step 2<input id="scAi" type="number" min="0" step="0.1" value="0"></label>
  </div>
  <div class="out" id="scOut"></div>
</div>
<p>The Transformation POD covers SRE, automation, CI/CD and AI adoption. AI engineers from Step 2 sit inside the POD, so Step 6 adds only the part they don't already cover. AIOps is never counted twice.</p>
${tryTool(4,"Choose the client's AI adoption.")}
<div class="quiz" data-quiz="s4"></div>`,
quiz:[
 {q:"Moderate AI adoption, and 70% of tower FTE is from ticket history. Scenario?",o:["1","2","3","4"],a:3,why:"Moderate AI + volumetrics available = Scenario 4 (POD 20%+, AIOps 1:8)."},
 {q:"POD is 2.5 FTE and Step 2 already added 4 AI engineers. What does Step 6 add?",o:["2.5","6.5","0"],a:2,why:"AI engineers sit inside the POD; they already exceed it, so nothing more is added."}
]},

{id:"s6",grp:"Part 2 · Validate and finalise",t:"Step 7 · Seniority, contingency, confidence",html:()=>`
<span class="eyebrow">Part 2 · Step 7</span>
<h1>Seniority, contingency and confidence</h1>
<p class="lead">Complexity sets the grade pyramid (mix only, no headcount change) and the contingency: Low 5%, Medium 7.5%, High 10%.</p>
<h2>Does the grade mix fit the windows?</h2>
<p>Seniority never changes headcount. A <b>low-complexity</b> estate leans on juniors (1:2:4, more Consultants); <b>medium</b> is 1:2:3; a <b>high-complexity</b> estate leans on seniors (1:2:2). The check card then asks for a minimum number of Leads or Seniors on duty in every staffed hour (default 1) and tells you whether the pyramid gives enough of them. If it is short, the tool flags it and does not add people: move the pyramid up, name seniors as on-call cover, or lower the requirement. <b>Only the SDMs and a tech lead on L3 are Lead</b>: L2 has Seniors and Consultants only, and Lead is never above Senior across the whole team, so on a small team the tech lead gives way and Consultants are lifted to Senior if the SDMs alone would outnumber the Seniors.</p>
<h2>Estimate confidence (Annexure 1)</h2>
<p>Nine drivers scored 1–5, weighted to a score out of 100. The tool suggests each score from what earlier steps know; override any with what the deal team has actually seen.</p>
<div class="tbl"><table><thead><tr><th>Driver</th><th class="r">Weight</th></tr></thead><tbody>
<tr><td>Ticket volumetrics and demand</td><td class="r">22</td></tr><tr><td>SLA/SLO tier</td><td class="r">15</td></tr><tr><td>Coverage model</td><td class="r">13</td></tr>
<tr><td>Portfolio complexity</td><td class="r">12</td></tr><tr><td>Transition and handoff</td><td class="r">10</td></tr><tr><td>Domain criticality</td><td class="r">10</td></tr>
<tr><td>Change intensity</td><td class="r">8</td></tr><tr><td>Tech stack and tooling</td><td class="r">6</td></tr><tr><td>AIOps maturity</td><td class="r">4</td></tr>
</tbody></table></div>
<p>Bands: <b>0–39 Low</b>, <b>40–59 Medium</b>, <b>60–79 High</b>, <b>80+ Highest</b>. Each has contingency guidance; the page flags when yours is outside it. Drivers scored 1–2 become <b>due diligence items</b>. The band also sets the low–high range shown in the Overall estimate.</p>
${tryTool(6,"Score the drivers honestly; the range follows.")}
<div class="quiz" data-quiz="s6"></div>`,
quiz:[
 {q:"Does changing the pyramid from 1:2:4 to 1:2:2 change the FTE?",o:["Yes","No, it changes the grade mix only"],a:1,why:"The pyramid decides Lead : Senior : Consultant shares of the same team."},
 {q:"A driver scored 2. What should happen?",o:["Nothing","It becomes a due diligence item or a commercial caveat","Contingency doubles"],a:1,why:"Annexure 1 Step 4: drivers scored 1–2 become explicit assessment items."}
]},

{id:"s7",grp:"Part 2 · Validate and finalise",t:"Step 8 · Term, savings, transition",html:()=>`
<span class="eyebrow">Part 2 · Step 8</span>
<h1>Term, Year 2+ savings and transition</h1>
<p class="lead">Year 1 is the Step 7 team. From Year 2 the team shrinks; a longer term captures more of those years, so the average team per year falls.</p>
<h2>Two ways to work out savings</h2>
<div class="cols2">
  <div class="card"><h3>Scenario YoY %</h3>A flat % a year from Year 2 (Scenario 1/3: 13.5%, 2: 11%, 4: 17.5%), applied above the coverage floor. Simple and framework-aligned.</div>
  <div class="card"><h3>AIOps use cases</h3>Pick what the AI engineers build (14 use cases with build effort, deflection, start year and ramp). The panel shows FTE freed, net of the engineers, and whether they can build it in time.</div>
</div>
<div class="warn"><b>Heads-up</b> With the default seven use cases, the portfolio usually frees less than the scenario target, and can be less than the AI engineers it takes. The verdict panel shows the net figure; use it to challenge the AIOps ratio or the use-case list.</div>
<h2>Transition (optional)</h2>
<p>Knowledge-transfer weeks (team 50% present), parallel-run weeks (full team) and a transition manager, in FTE-months. It's a one-off before service start and is <b>not</b> added to the Year 1 team.</p>
${tryTool(7,"Choose the term and compare the 1–5 year table.")}`},

{id:"s8",grp:"Part 2 · Validate and finalise",t:"Step 9 · Final fact check & approval",html:()=>`
<span class="eyebrow">Part 2 · Step 9</span>
<h1>Final fact check, overall estimate and approval</h1>
<p class="lead">Compare the final team with the team running the estate today (entered at step 4), then read the Overall estimate the way a deal desk will.</p>
<div class="tip"><b>Commercial position is a separate step</b> The numbers on this step are the modelled ones. A proposed final number and the commercial options live in Step 10, which is optional and never changes steps 1 to 9.</div>
<h2>In the Overall estimate panel</h2>
<div class="tbl"><table><thead><tr><th>View</th><th>What to look for</th></tr></thead><tbody>
<tr><td>How each step built the team</td><td>The build-up from the base team to the Part 1 team, then what skill cover, transformation, the SDM re-base and contingency added, with rounding and transition</td></tr>
<tr><td>Year 1 team by role</td><td>Every FTE traced to a skill set, tower or step; rows add up to the total</td></tr>
<tr><td>Allowances</td><td>Productive need → utilisation, leave, contingency, risk. The buffer % is what a deal desk asks about</td></tr>
<tr><td>Assumptions register</td><td>Every assumption from every step, grouped by category. Edit them in the step they belong to</td></tr>
<tr><td>Where the inputs came from</td><td>Document sources and quotes; anything edited after import</td></tr>
<tr><td>Deviations from the framework</td><td>Every benchmark you changed, with the framework value</td></tr>
</tbody></table></div>
<h2>Approval</h2>
<ol class="steps">
<li><div>Set <b>Version</b> and <b>Prepared by</b>, then status <span class="ui">Submitted for approval</span>.</div></li>
<li><div>The approver sets <span class="ui">Approved</span> and their name. The tool fingerprints every input.</div></li>
<li><div>If anything changes afterwards, the header badge and both summaries say <b>Changed since approval</b>.</div></li>
</ol>
<h2>Scenarios and checks</h2>
<p><span class="ui">Save current as a scenario</span>, change inputs (e.g. 24×7 instead of 16×5), save again, and tick to compare side by side. <span class="ui">Run checks</span> verifies the engine against the framework's worked examples and that this estimate adds up.</p>
${tryTool(8,"Read the allowances and run the checks.")}`},
{id:"s10",grp:"Part 3 · Commercial position",t:"Step 10 · Commercial position",html:()=>`
<span class="eyebrow">Part 3 · Step 10</span>
<h1>Commercial position</h1>
<p class="lead">Optional. Set a proposed final number for a client budget or to win on price, see the risks it creates, and see which commercial shape the data supports. Steps 1 to 9 stay as modelled.</p>
<h2>A proposed final number</h2>
<p>Tick <span class="ui">Adjust the final number</span> and choose how to set it: <b>Year 1 FTE</b> (type the number you want, for example 7 where the tool models 10; every later year moves by the same proportion), <b>% change</b> (a negative number adds capacity), or <b>Per year</b> (set each year yourself). Choose a <b>reason</b>: nothing changes until one is on record. The cut comes out of contingency first, then the delivery team (SDM included). The panel shows modelled against proposed by year and the implied utilisation, the risks the numbers create (the team runs hotter than planned, below the Step 1 base team, contingency used up, well below the existing team, relying on faster AI savings, scope unchanged while capacity falls) and mitigations you can tick, reword or add to.</p>
<p>The proposed number drives the client summary, which shows it and nothing else from this step, and the Excel workbook. The summary document keeps the modelled steps and adds this step with the reason, the risks and the mitigations. Step 9 and the Overall estimate always show the modelled numbers.</p>
<h2>Commercial options</h2>
<p>Four optional inputs (months of ticket history, a measurable baseline, the client's Year 1 budget ceiling, price pressure) feed a rating of four commercial shapes: <b>fixed fee</b>, <b>outcome-based terms</b> (as an add-on), <b>time and materials with a cap</b>, and an <b>assessment-led start</b>. It starts from the framework's recommendation for the scenario and adjusts for the data you have, with reasons, guardrails and what would move each option up. If the budget ceiling is below the modelled Year 1 team, a button sets the ceiling as the proposed Year 1 team. Model level only: no price, and not in the client summary.</p>
${tryTool(10,"Set a proposed Year 1 team and read the risks and the commercial options.")}`},

{id:"share",grp:"Review & share",t:"Sharing the estimate",html:()=>`
<span class="eyebrow">Review &amp; share</span>
<h1>What to send to whom</h1>
<div class="tbl"><table><thead><tr><th>Output</th><th>For</th><th>What's in it</th></tr></thead><tbody>
<tr><td><span class="ui">Download summary</span></td><td>Deal review, deal desk</td><td>Every stage's working, allowances, deviations, confidence, sources, scenarios, checks, assumptions and risks</td></tr>
<tr><td><span class="ui">Customer summary</span></td><td>The client</td><td>Coverage in plain words, scope and SLAs, team by role and location, year by year, transition, what we need from them. <b>No</b> contingency, risk, rounding or framework working</td></tr>
<tr><td><span class="ui">Export Excel</span></td><td>Pricing sheet</td><td>13 sheets of plain numbers: towers, roles, locations, years, allowances, confidence …</td></tr>
<tr><td><span class="ui">Save file</span></td><td>Colleagues, the deal folder</td><td>Every input, approval and saved scenarios; <span class="ui">Open file</span> reloads it exactly</td></tr>
<tr><td><span class="ui">Copy summary</span></td><td>Slides, notes</td><td>The working as Markdown text</td></tr>
</tbody></table></div>
<div class="warn"><b>Before sending the customer summary</b> It includes your own assumptions as written, so phrase them for the client. Roles are in FTE and locations in people, so the totals differ by rounding; the total row explains it.</div>`},

{id:"example",grp:"Practice",t:"Worked example",html:()=>`
<span class="eyebrow">Practice · 15 min</span>
<h1>Worked example: Acme Retail</h1>
<p class="lead">Build this estimate yourself, then check your numbers against ours. Or <a href="docs/example-acme-retail.damo.json" download>download the finished estimate</a> and open it with <span class="ui">Open file</span>.</p>
<h2>The brief</h2>
<ul>
<li>24×5 support, customer clock UTC+0, starting 00:00. Use <span class="ui">Lay out evenly</span>: India gets two 8-hour windows and Romania the third. Romania's window is <b>on call for P1s only</b>: switch it to <span class="ui">On-call (P1)</span>.</li>
<li><b>AMS</b>: 400 incidents a month from the client's ITSM export. Client keeps L1; we provide L2 + L3. <b>Silver</b> SLA, modern estate, <b>AIOps in scope</b>. Skill sets: Systems Support Engineer 70%, Front end dev 30%.</li>
<li><b>IMS</b>: no ticket history. 4 environments, 2 hosting platforms, 3 databases, security operations in scope. Client L1, us L2 + L3, complex legacy, <b>SRE in scope</b>, no AIOps. Skill set: Infra support engineer 100%.</li>
<li>Client AI adoption <b>Low</b>; complexity <b>Medium</b>; <b>3-year</b> term; scenario YoY savings.</li>
</ul>
<h2>Check your numbers</h2>
<div class="tbl"><table id="exTbl"><thead><tr><th>Checkpoint</th><th class="r">Expected</th><th>Why</th><th>Got it?</th></tr></thead><tbody></tbody></table></div>
<div class="tip"><b>If a number is off</b> The usual suspects: the counts level on AMS (should be all tickets, L1), the ownership preset (click it even if it looks selected), share % on skill sets, and Romania's window set to On-call (P1).</div>
${tryTool(1,"Start at step 1 with a fresh estimate (Reset in the header).")}`},

{id:"faq",grp:"Reference",t:"FAQ",html:()=>`
<span class="eyebrow">Reference</span>
<h1>Frequently asked questions</h1>
<input class="search" id="faqQ" type="search" placeholder="Search the questions" aria-label="Search FAQ">
<div id="faqList"></div>`},

{id:"glossary",grp:"Reference",t:"Glossary",html:()=>`
<span class="eyebrow">Reference</span>
<h1>Glossary</h1>
<input class="search" id="glQ" type="search" placeholder="Search terms" aria-label="Search glossary">
<dl class="gl" id="glList"></dl>`}
];

const PREP=["The RFP or scope document","Support window: hours, days, and which hours are on call only","Delivery locations (onshore, nearshore, offshore) and who covers which shift","Ticket history per estate: incidents and service requests a month, ideally 3–6 months with priority","Where the tickets are counted: all tickets at the service desk, or an incumbent's L2 queue","Who provides L1, L2 and L3 today and after we take over","SLA targets: P1/P2 response and restore, availability","Estate size if no tickets: apps by complexity, environments and databases, pipelines, AI agents and models","Enhancement or change-request hours a month in the run scope","Whether SRE and AIOps are in scope","Client AI maturity (AI in observability, automated runbooks in production?)","Contract term","Today's team: L2, L3, SRE/automation, managers"];

const EXAMPLE=[
 ["Step 1 base team","6.14 FTE · 8 people","24×5, 1 L2 + 1 L3 on duty, Romania's window on call at 15%, ÷ 85%, leave backfill"],
 ["AMS tower FTE","15.52","400 tickets → L2 280, L3 56; Silver +12% L2 / +22% L3; +4% coordination"],
 ["IMS tower FTE","2.11","Score 13 × 4.5 = 59 tickets; legacy B 35%; +4% coordination"],
 ["Step 2 team","24.18 FTE","19.82 support (incl. leave backfill) + 4.36 AI engineers at 1:4"],
 ["Step 6 adds","0.00","POD 12.5% of 19.82 = 2.48 is less than the 4.36 AI engineers already in it"],
 ["Part 1 team (step 3)","27.20 FTE","Work team 19.82 beats base 6.14; + AI engineers; + 3.02 SDM (1:8)"],
 ["Year 1 team (step 7)","29.24 FTE · 30 people","+ 7.5% contingency (Medium)"],
 ["SRE","0.81 FTE","78% of the IMS tower's L3 FTE (incl. contingency share)"],
 ["3-year average","26.09 FTE a year","29.2 → 25.8 → 23.2; 13.5% a year above the floor"],
 ["Confidence","51 · Medium","Range about 24.9 – 33.6 FTE"]
];

const FAQ=[
 ["Why did my team jump when I added a tower?","Once the work team is larger than the base team, the work sets the size. Before that, extra work is absorbed by people who are already needed to cover shifts. Look at the Step 3 verdict sentence."],
 ["The bar at the bottom shows a different number from the final estimate.","The bar shows the team after the stage you're on. It becomes the final Year 1 team from Step 7."],
 ["Why is rounding adding so much?","People are rounded up in each location and tier (L2, L3, SDM). A small team spread over two locations can gain 2–3 people. Change rounding in Step 1 to see the effect."],
 ["We don't have ticket data. Can we still estimate?","Yes: use structural complexity (T-shirt sizing) or monthly active users. The confidence score will be lower and the range wider; list 'ticket history' as a due diligence item."],
 ["Should I use flat YoY savings or AIOps use cases?","Flat YoY follows the framework's scenario targets and is the default. Use cases show what the AI engineers would actually build; use them to test whether the savings claim is backed."],
 ["Is transition in the Year 1 team?","No. It's a one-off effort before service start, shown in FTE-months in Step 8, the Overall estimate and the customer summary."],
 ["How do I share an estimate with a colleague?","Save file, send the .damo.json, and they use Open file. Saved scenarios travel inside the file."],
 ["What does 'Changed since approval' mean?","Someone edited an input after the estimate was approved. Approve again or set the status back to Draft."],
 ["Extract with AI says the passphrase is wrong.","Ask the tool owner for the current passphrase; it's set on the Netlify project as INTAKE_PASSPHRASE."],
 ["Where are my estimates stored?","In your browser only, until you Save file. Clearing browser data or using another browser starts fresh."],
 ["Does the SDM count as part of a tower?","No. Service Delivery Managers are sized in Step 3 at 1 per 8 delivery FTE and appear under Governance in the team by role."]
];

const GLOSS=[
 ["FTE","Full-time equivalent: one person working full time (40 hours a week). Part-FTE roles are shared across towers."],
 ["Base team","Step 1: the people needed to keep someone on every shift, whatever the volume."],
 ["Work team","steps 2, 5 and 6: the people the work takes (tickets, enhancements, specialist cover, transformation)."],
 ["Delivery team","The larger of the base team and the work team (without AI engineers), plus AI engineers."],
 ["Pass-through","Share of tickets passed to the next level: L1→L2 70%, L2→L3 20% ([F] 1.4)."],
 ["ARE","Average resolution effort per ticket: L1 0.25 h, L2 3 h, L3 10 h."],
 ["A, B, C effort","A: ticket effort; B: non-ticketing effort (automation, patching, governance) at 25% or 35% of A; C: enhancement hours."],
 ["Utilisation","Share of contracted hours a person is productive: 85% ([F] G6). Not a buffer."],
 ["Leave backfill","Extra FTE to cover annual leave and public holidays per location."],
 ["On-call allowance","How much of a staffed shift an on-call (P1 only) shift counts as: 15% flat, or standby + P1 workload."],
 ["Interface","Two adjacent support levels with different owners. Each adds 4% coordination to our ticket effort."],
 ["SLA uplift","Extra L2/L3 effort for stringent SLAs: P1 response ≤15 min +25%, ≤30 min +12%, 99.9% availability +10%, P1 restore ≤2 h +10% on L3; cap 40%."],
 ["AIOps","AI for operations: intelligent alerting, automated root-cause analysis, ticket classification, self-healing."],
 ["AI engineers","Built into towers with AIOps in scope at 1:4 (low AI adoption) or 1:8 (moderate) of support FTE."],
 ["SRE","Site/Service Reliability Engineering. On IMS towers, takes 78% of L3 FTE when named as a capability."],
 ["Transformation POD","Capacity for SRE, automation, CI/CD and AI adoption: 12.5–20% of the support team by scenario."],
 ["Scenario","Framework Part 3: 1–4 from client AI adoption × volumetrics availability. Sets POD share, AIOps ratio and savings target."],
 ["SDM","Service Delivery Manager: governance, one per 8 delivery FTE."],
 ["Contingency","Extra FTE for estimate risk: 5%, 7.5% or 10% by complexity; tapers from Year 2."],
 ["Coverage floor","The base team. Savings never cut below it when 'Keep the coverage floor' is on."],
 ["Deflection","Share of effort an AIOps use case removes at full adoption, combined per level and capped by a ceiling."],
 ["Confidence score","Annexure 1: nine weighted drivers scored 1–5, out of 100; bands Low / Medium / High / Highest."],
 ["[F], [P], proposed","Source tags: DAMO Solution Estimation Framework, AI_Works pricing sheet, or a value the framework doesn't give."]
];

/* ================= calculators ================= */
function calcCov(){
  const H=+$("cvH").value, D=+$("cvD").value, c=Math.max(1,+$("cvC").value||1);
  const kSel=$("cvK"), prev=+kSel.value||0;
  kSel.innerHTML=[...Array(H+1).keys()].filter(i=>i%4===0||i===H).map(i=>`<option value="${i}" ${i===Math.min(prev,H)?"selected":""}>${i}</option>`).join("");
  const k=Math.min(+kSel.value||0,H), oc=Math.max(0,Math.min(100,+$("cvO").value||0))/100;
  const a=H*D, aE=(H-k)*D+k*D*oc, b=40, roster=aE*c/b;
  $("cvOut").innerHTML=`<div class="row"><span>Window hours to cover a week (a)</span><span>${H} × ${D} = ${a}</span></div>
   ${k?`<div class="row"><span>Staffed hours (a′)</span><span>${fmt(aE,1)}</span><div class="f">${(H-k)*D} active + ${k*D} on-call × ${fmt(oc*100,0)}%</div></div>`:""}
   <div class="row"><span>Hours one FTE works (b)</span><span>${b}</span></div>
   <div class="row tot"><span>Roster FTE</span><span>${fmt(roster,2)}</span><div class="f">(${k?"a′":"a"} × ${c}) ÷ ${b}</div></div>
   <div class="row"><span>After 85% utilisation</span><span>${fmt(roster/0.85,2)}</span><div class="f">The tool then adds leave and holiday backfill per location.</div></div>`;
}
const OWN={cl1:{L1:0,L2:1,L3:1,b:1},full:{L1:1,L2:1,L3:1,b:0},l2:{L1:0,L2:1,L3:0,b:2},l3:{L1:0,L2:0,L3:1,b:1}};
const SLA={none:[0,0],bronze:[.12,.22],silver:[.12,.22],gold:[.22,.32]};
function calcTw(){
  const T=Math.max(0,+$("twT").value||0), lvl=$("twL").value, o=OWN[$("twO").value], s=SLA[$("twS").value], bp=$("twE").value==="legacy"?.35:.25;
  let c1,c2,c3;if(lvl==="l1"){c1=T*.3;c2=T*.7;c3=c2*.2}else{c1=0;c2=T;c3=T*.2}
  const l1=o.L1?c1:0,l2=o.L2?c2:0,l3=o.L3?c3:0, h=o.b*.04;
  const raw=l1*.25+l2*3*(1+s[0])+l3*10*(1+s[1]), A=raw/.85*(1+h), B=A*bp, fte=(A+B)/160;
  $("twOut").innerHTML=`<div class="row"><span>Tickets we handle · L1 / L2 / L3</span><span>${fmt(l1,1)} / ${fmt(l2,1)} / ${fmt(l3,1)}</span>${lvl==="l2"&&o.L1?`<div class="f">Counts at L2 don't tell us L1 volume: the tool warns and sizes no L1.</div>`:""}</div>
   <div class="row"><span>SLA uplift · coordination</span><span>+${fmt(s[0]*100,0)}% L2 / +${fmt(s[1]*100,0)}% L3 · +${fmt(h*100,0)}%</span></div>
   <div class="row"><span>A · ticket effort</span><span>${fmt(A,1)} h</span><div class="f">(L1 × 0.25 + L2 × 3 + L3 × 10, with SLA) ÷ 85% × (1 + coordination)</div></div>
   <div class="row"><span>B · non-ticketing effort</span><span>${fmt(B,1)} h</span></div>
   <div class="row tot"><span>Tower FTE</span><span>${fmt(fte,2)}</span><div class="f">(A + B) ÷ 160 hours a month</div></div>`;
}
function calcSc(){
  const mod=$("scA").value==="moderate", vol=$("scV").value==="1", sc=vol?(mod?4:3):(mod?2:1);
  const pod={1:12.5,2:17.5,3:12.5,4:20}[sc], ratio=mod?8:4, run=Math.max(0,+$("scR").value||0), ai=Math.max(0,+$("scAi").value||0);
  const P=run*pod/100, add=Math.max(0,P-ai);
  $("scOut").innerHTML=`<div class="row tot"><span>Framework scenario</span><span>${sc}</span><div class="f">${mod?"Moderate":"Low"} AI · volumetrics ${vol?"available":"unavailable"}</div></div>
   <div class="row"><span>POD share · AIOps ratio</span><span>${pod}% · 1:${ratio}${ratio===8?" (1:6 over 20 FTE)":""}</span></div>
   <div class="row"><span>Transformation POD</span><span>${fmt(P,2)} FTE</span></div>
   <div class="row tot"><span>Step 6 adds</span><span>${fmt(add,2)} FTE</span><div class="f">POD ${fmt(P,2)} − AI engineers ${fmt(ai,2)}${ai>=P&&ai>0?": the AI engineers already cover the POD":""}</div></div>`;
}
function calcRe(){
  const B=Math.max(0,+$("reB").value||0), W=Math.max(0,+$("reW").value||0), A=Math.max(0,+$("reA").value||0), r=Math.max(1,+$("reS").value||8);
  const del=Math.max(W,B)+A, sdm=del/r;
  $("reOut").innerHTML=`<div class="row"><span>${W>=B?"Work team is larger: kept":"Base team is larger: team lifted to it"}</span><span>${fmt(Math.max(W,B),2)}</span>${W<B?`<div class="f">${fmt(B-W,2)} FTE of spare time for enhancements or transformation</div>`:""}</div>
   <div class="row"><span>+ AI engineers</span><span>${fmt(A,2)}</span></div>
   <div class="row"><span>Delivery team</span><span>${fmt(del,2)}</span></div>
   <div class="row"><span>+ SDM (1 per ${r})</span><span>${fmt(sdm,2)}</span></div>
   <div class="row tot"><span>Team after Step 3</span><span>${fmt(del+sdm,2)} FTE</span></div>`;
}

/* ================= quiz ================= */
function renderQuiz(ch){
  const el=document.querySelector(`[data-quiz="${ch.id}"]`);if(!el||!ch.quiz)return;
  const st=P.quiz[ch.id]||{};
  el.innerHTML=`<h3>Check your understanding</h3>`+ch.quiz.map((q,i)=>`<div class="q" data-qi="${i}"><p>${esc(q.q)}</p><div class="opts">${q.o.map((o,j)=>`<button type="button" data-qa="${ch.id}:${i}:${j}" class="${st[i]!=null?(j===q.a?"right":(st[i]===j?"wrong":"")):""}">${esc(o)}</button>`).join("")}</div>${st[i]!=null?`<div class="why">${st[i]===q.a?"Right. ":"Not quite. "}${esc(q.why)}</div>`:""}</div>`).join("")
    +`<div class="score">${Object.keys(st).length?`${ch.quiz.filter((q,i)=>st[i]===q.a).length} right of ${Object.keys(st).length} answered${Object.keys(st).length<ch.quiz.length?` · ${ch.quiz.length-Object.keys(st).length} to go`:""}`:""}</div>`;
}

/* ================= render ================= */
let cur=0;
function renderToc(){
  let h="",g="";
  CH.forEach((c,i)=>{if(c.grp!==g){g=c.grp;h+=`<li class="grp">${esc(g)}</li>`}
    h+=`<li class="${P.done[c.id]?"done":""}"><button type="button" data-ch="${i}" ${i===cur?'aria-current="page"':""}><span class="n">${P.done[c.id]?"✓":i+1}</span>${esc(c.t)}</button></li>`});
  $("toc").innerHTML=h;
  $("tocSel").innerHTML=CH.map((c,i)=>`<option value="${i}" ${i===cur?"selected":""}>${i+1}. ${esc(c.t)}${P.done[c.id]?" ✓":""}</option>`).join("");
  const n=CH.filter(c=>P.done[c.id]).length;
  $("progTxt").textContent=`${n} of ${CH.length} read`;$("progBar").style.width=(n/CH.length*100)+"%";
}
function show(i,focus){
  cur=Math.max(0,Math.min(CH.length-1,i));const ch=CH[cur];
  $("chap").innerHTML=ch.html()+`<div class="chapnav">${cur>0?`<button type="button" class="btn" data-ch="${cur-1}">← ${esc(CH[cur-1].t)}</button>`:"<span></span>"}${cur<CH.length-1?`<button type="button" class="btn primary" data-next="1">Mark as read · next: ${esc(CH[cur+1].t)} →</button>`:`<button type="button" class="btn primary" data-next="1">Mark as read</button>`}</div>`;
  if(ch.id==="prep")$("prepList").innerHTML=PREP.map((t,k)=>`<li><label><input type="checkbox" data-prep="${k}" ${P.check[k]?"checked":""}><span>${esc(t)}</span></label></li>`).join("");
  if(ch.id==="example")$("exTbl").querySelector("tbody").innerHTML=EXAMPLE.map((r,k)=>`<tr><td><b>${esc(r[0])}</b></td><td class="r mono">${esc(r[1])}</td><td style="color:var(--muted);font-size:14px">${esc(r[2])}</td><td><input type="checkbox" data-ex="${k}" ${P.check["ex"+k]?"checked":""} aria-label="Matched ${esc(r[0])}"></td></tr>`).join("");
  if(ch.id==="faq"){const r=q=>{$("faqList").innerHTML=FAQ.filter(f=>!q||(f[0]+f[1]).toLowerCase().includes(q)).map(f=>`<details class="faq"><summary>${esc(f[0])}</summary><p>${esc(f[1])}</p></details>`).join("")||"<p>No matches.</p>"};r("");$("faqQ").oninput=e=>r(e.target.value.toLowerCase())}
  if(ch.id==="glossary"){const r=q=>{$("glList").innerHTML=GLOSS.filter(g=>!q||(g[0]+g[1]).toLowerCase().includes(q)).map(g=>`<div><dt>${esc(g[0])}</dt><dd>${esc(g[1])}</dd></div>`).join("")||"<p>No matches.</p>"};r("");$("glQ").oninput=e=>r(e.target.value.toLowerCase())}
  if($("calcCov"))calcCov();if($("calcTw"))calcTw();if($("calcSc"))calcSc();if($("calcRe"))calcRe();
  renderQuiz(ch);renderToc();
  P.last=cur;save();
  try{history.replaceState(null,"","#"+ch.id)}catch(e){}
  if(focus){window.scrollTo({top:0});$("chap").focus({preventScroll:true})}
}
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;const d=b.dataset;
  if(d.ch!=null){show(+d.ch,true)}
  else if(d.next){P.done[CH[cur].id]=true;save();if(cur<CH.length-1)show(cur+1,true);else renderToc()}
  else if(d.qa){const [id,qi,j]=d.qa.split(":");P.quiz[id]=P.quiz[id]||{};P.quiz[id][qi]=+j;save();renderQuiz(CH.find(c=>c.id===id))}
});
document.addEventListener("input",e=>{const t=e.target;if(t.closest("#calcCov"))calcCov();if(t.closest("#calcTw"))calcTw();if(t.closest("#calcSc"))calcSc();if(t.closest("#calcRe"))calcRe()});
document.addEventListener("change",e=>{const t=e.target,d=t.dataset;
  if(d.prep!=null){P.check[d.prep]=t.checked;save()}
  else if(d.ex!=null){P.check["ex"+d.ex]=t.checked;save()}
  else if(t.id==="tocSel")show(+t.value,true);
  else if(t.closest("#calcCov"))calcCov();else if(t.closest("#calcTw"))calcTw();else if(t.closest("#calcSc"))calcSc();else if(t.closest("#calcRe"))calcRe();
});
const fromHash=CH.findIndex(c=>"#"+c.id===location.hash);
show(fromHash>=0?fromHash:(P.last||0),false);
})();
</script>
